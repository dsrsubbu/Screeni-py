name: "Copilot Setup Steps - Screeni-py"

# Run manually or when this file changes so Copilot can validate the setup
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name MUST be `copilot-setup-steps` for Copilot cloud agent
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Upgrade pip and install uv
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade uv

      - name: Sync project dependencies (uv)
        run: |
          # mirror CI parity: install project deps including dev group
          uv sync --group dev

      - name: Install TA extras (CI parity)
        run: |
          uv pip install ta
          uv pip install --no-deps advanced-ta
          uv pip install --no-deps pandas-ta-remake

      - name: Verify Streamlit is available
        run: |
          python -c "import streamlit; print('streamlit', getattr(streamlit, '__version__', 'unknown'))"
